<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind 3D Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #2c2d30 0%, #121212 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e1e2f;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 550px;
      text-align: center;
      transition: max-width 0.3s ease;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2rem;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ff7675, #74b9ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .instructions {
      color: #a0a0b0;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    /* ตัวเลือกความยาก */
    .difficulty-selector {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 12px;
    }

    .difficulty-selector label {
      font-size: 0.9rem;
      color: #ddd;
    }

    .diff-btn {
      background: #2a2a40;
      color: #aaa;
      border: 1px solid #444;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .diff-btn.active {
      background: #4e54c8;
      color: #fff;
      border-color: #6c5ce7;
      box-shadow: 0 0 10px rgba(78, 84, 200, 0.5);
    }

    /* คำอธิบายหมุดบอกคำตอบ */
    .legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 0.8rem;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.03);
      padding: 8px;
      border-radius: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot-sample { 
      width: 12px; 
      height: 12px; 
      border-radius: 50%; 
      display: inline-block;
    }
    .dot-exact { 
      background: radial-gradient(circle at 35% 35%, #ff7675, #d63031); 
      box-shadow: 0 0 5px rgba(214, 48, 49, 0.8);
    }
    .dot-color { 
      background: radial-gradient(circle at 35% 35%, #ffffff, #b2bec3); 
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* แถบแสดงเฉลยรหัสลับ */
    .secret-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px dashed #555;
    }

    .secret-label {
      font-size: 0.9rem;
      color: #aaa;
      font-weight: bold;
    }

    .peg.hidden-peg {
      background: radial-gradient(circle at 35% 35%, #2c2c3e, #181824);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-weight: bold;
      font-size: 1rem;
      cursor: default;
    }

    .peg.reveal-peg {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: default;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ข้อความแจ้งเตือนผลลัพธ์ */
    .status-msg {
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 1.05rem;
      min-height: 25px;
    }

    /* กระดานเล่น */
    .board {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 420px;
      overflow-y: auto;
      padding: 5px 8px 5px 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #252538;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid transparent;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .row.active {
      border-color: #6c5ce7;
      background: #2d2d48;
      box-shadow: 0 0 12px rgba(108, 92, 231, 0.3), inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .slots {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
    }

    /* หมุดเล่น 3D */
    .peg {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 120%, #3a3a50, #12121e);
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.8), 0 1px 2px rgba(255,255,255,0.1);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      border: 2px solid #333;
    }

    .peg.selected {
      border-color: #00cec9;
      transform: scale(1.15);
      box-shadow: 0 0 10px #00cec9;
    }

    /* หมุดบอกคำตอบ */
    .feedback {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      grid-auto-flow: column;
      gap: 4px;
      align-items: center;
      justify-items: center;
      background: rgba(0,0,0,0.3);
      padding: 5px;
      border-radius: 8px;
    }

    .feedback-peg {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #151520;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }

    .feedback-peg.exact { 
      background: radial-gradient(circle at 35% 35%, #ff7675, #d63031); 
      box-shadow: 0 0 6px #d63031;
    }
    .feedback-peg.color { 
      background: radial-gradient(circle at 35% 35%, #ffffff, #b2bec3); 
      box-shadow: 0 0 6px #ffffff;
    }

    /* จานเลือกสี (Color Picker) */
    .color-picker {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* ปุ่มเม็ดสี 3D */
    .color-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .color-btn:hover {
      transform: scale(1.2) translateY(-2px);
    }

    /* สไตล์สีสามมิติ */
    .c-red    { background: radial-gradient(circle at 35% 35%, #ff7675 0%, #d63031 60%, #8b0000 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-blue   { background: radial-gradient(circle at 35% 35%, #74b9ff 0%, #0984e3 60%, #003e80 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-green  { background: radial-gradient(circle at 35% 35%, #55efc4 0%, #00b894 60%, #005040 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-yellow { background: radial-gradient(circle at 35% 35%, #ffeaa7 0%, #fdcb6e 60%, #c67d00 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-purple { background: radial-gradient(circle at 35% 35%, #a29bfe 0%, #6c5ce7 60%, #321b88 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-orange { background: radial-gradient(circle at 35% 35%, #fab1a0 0%, #e17055 60%, #8c2500 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-pink   { background: radial-gradient(circle at 35% 35%, #fd79a8 0%, #e84393 60%, #880e4f 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }
    .c-cyan   { background: radial-gradient(circle at 35% 35%, #81ecec 0%, #00cec9 60%, #00565b 100%); box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4); }

    /* ปุ่มควบคุม */
    .actions {
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit { 
      background: linear-gradient(135deg, #6c5ce7, #a29bfe); 
      color: white; 
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(108, 92, 231, 0.6); }
    .btn-submit:disabled { background: #444; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }

    .btn-reset { background: #333; color: white; border: 1px solid #555; }
    .btn-reset:hover { background: #444; }
  </style>
</head>
<body>

  <div class="container" id="gameContainer">
    <h1>MASTERMIND 3D</h1>
    <p class="instructions">เดารหัสสีให้ถูกต้องภายใน 10 ครั้ง</p>

    <!-- เลือกระดับความยาก -->
    <div class="difficulty-selector">
      <label>ความยาก:</label>
      <button class="diff-btn active" data-pegs="4">4 หมุด</button>
      <button class="diff-btn" data-pegs="6">6 หมุด</button>
      <button class="diff-btn" data-pegs="8">8 หมุด</button>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="dot-sample dot-exact"></span> ถูกสี ถูกตำแหน่ง</div>
      <div class="legend-item"><span class="dot-sample dot-color"></span> ถูกสี ผิดตำแหน่ง</div>
    </div>

    <!-- แถบเฉลยรหัสลับ -->
    <div class="secret-container" id="secretContainer">
      <span class="secret-label" id="secretLabel">🔒 รหัสลับ:</span>
      <div class="slots" id="secretSlots"></div>
    </div>

    <!-- ข้อความแสดงผลชนะ/แพ้ -->
    <div class="status-msg" id="statusMsg"></div>

    <!-- กระดานสำหรับเดา -->
    <div class="board" id="board"></div>

    <!-- จานเลือกสี -->
    <div class="color-picker" id="colorPicker"></div>

    <div class="actions">
      <button class="btn btn-reset" id="resetBtn">เริ่มใหม่</button>
      <button class="btn btn-submit" id="submitBtn" disabled>ส่งคำตอบ</button>
    </div>
  </div>

  <script>
    const ALL_COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'cyan'];
    const MAX_ATTEMPTS = 10;

    let codeLength = 4;
    let availableColors = [];
    let secretCode = [];
    let currentAttempt = 0;
    let selectedSlotIndex = 0;
    let currentGuess = [];
    let isGameOver = false;

    // DOM Elements
    const boardEl = document.getElementById('board');
    const colorPickerEl = document.getElementById('colorPicker');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusMsg = document.getElementById('statusMsg');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const gameContainer = document.getElementById('gameContainer');
    const secretSlotsEl = document.getElementById('secretSlots');
    const secretLabelEl = document.getElementById('secretLabel');

    // เลือกระดับความยาก
    diffBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        diffBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        codeLength = parseInt(e.target.dataset.pegs);
        
        if(codeLength === 8) gameContainer.style.maxWidth = '650px';
        else if(codeLength === 6) gameContainer.style.maxWidth = '550px';
        else gameContainer.style.maxWidth = '450px';

        initGame();
      });
    });

    // เริ่มเกมใหม่
    function initGame() {
      const numColors = codeLength === 4 ? 6 : 8;
      availableColors = ALL_COLORS.slice(0, numColors);

      secretCode = Array.from({ length: codeLength }, () => availableColors[Math.floor(Math.random() * availableColors.length)]);
      currentAttempt = 0;
      selectedSlotIndex = 0;
      currentGuess = new Array(codeLength).fill(null);
      isGameOver = false;
      statusMsg.textContent = '';
      submitBtn.disabled = true;

      // รีเซ็ตแถบเฉลยรหัสลับเป็นซ่อนอยู่ (?)
      secretLabelEl.textContent = '🔒 รหัสลับ:';
      secretSlotsEl.innerHTML = '';
      for (let i = 0; i < codeLength; i++) {
        const peg = document.createElement('div');
        peg.className = 'peg hidden-peg';
        peg.textContent = '?';
        secretSlotsEl.appendChild(peg);
      }

      // สร้าง Color Picker
      colorPickerEl.innerHTML = '';
      availableColors.forEach(color => {
        const btn = document.createElement('button');
        btn.className = `color-btn c-${color}`;
        btn.dataset.color = color;
        colorPickerEl.appendChild(btn);
      });

      // สร้างกระดาน
      boardEl.innerHTML = '';
      for (let i = 0; i < MAX_ATTEMPTS; i++) {
        const row = document.createElement('div');
        row.className = `row ${i === 0 ? 'active' : ''}`;
        row.id = `row-${i}`;

        const slots = document.createElement('div');
        slots.className = 'slots';
        for (let j = 0; j < codeLength; j++) {
          const peg = document.createElement('div');
          peg.className = `peg ${i === 0 && j === 0 ? 'selected' : ''}`;
          peg.dataset.slot = j;
          peg.addEventListener('click', () => handleSlotClick(i, j));
          slots.appendChild(peg);
        }

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        for (let k = 0; k < codeLength; k++) {
          const fbPeg = document.createElement('div');
          fbPeg.className = 'feedback-peg';
          feedback.appendChild(fbPeg);
        }

        row.appendChild(slots);
        row.appendChild(feedback);
        boardEl.appendChild(row);
      }
    }

    // เปิดเผยเฉลยรหัสลับด้วยหมุดสี 3D
    function revealSecretCode() {
      secretLabelEl.textContent = '🔓 เฉลยรหัสลับ:';
      secretSlotsEl.innerHTML = '';
      secretCode.forEach(color => {
        const peg = document.createElement('div');
        peg.className = `peg c-${color} reveal-peg`;
        secretSlotsEl.appendChild(peg);
      });
    }

    // คลิกเลือกช่องที่ต้องการใส่สี
    function handleSlotClick(rowIndex, slotIndex) {
      // ห้ามเลือกช่องหากเกมจบแล้ว หรือเลือกสีครบทุกช่องในแถบนี้แล้ว
      if (rowIndex !== currentAttempt || isGameOver || !currentGuess.includes(null)) return;
      selectedSlotIndex = slotIndex;
      updateSlotHighlights();
    }

    // ไฮไลต์ช่องที่เลือกอยู่
    function updateSlotHighlights() {
      const activeRow = document.getElementById(`row-${currentAttempt}`);
      const pegs = activeRow.querySelectorAll('.peg');
      pegs.forEach((peg, idx) => {
        peg.classList.toggle('selected', idx === selectedSlotIndex);
      });
    }

    // เมื่อกดเลือกสีจากแถบสี
    colorPickerEl.addEventListener('click', (e) => {
      // หากเลือกสีครบทุกช่องแล้ว ห้ามเปลี่ยนสีอีกจนกว่าจะกดส่งคำตอบ
      if (!e.target.classList.contains('color-btn') || isGameOver || !currentGuess.includes(null)) return;

      const chosenColor = e.target.dataset.color;
      currentGuess[selectedSlotIndex] = chosenColor;

      const activeRow = document.getElementById(`row-${currentAttempt}`);
      const peg = activeRow.querySelectorAll('.peg')[selectedSlotIndex];
      
      ALL_COLORS.forEach(c => peg.classList.remove(`c-${c}`));
      peg.classList.add(`c-${chosenColor}`);

      // ตรวจสอบว่าใส่ครบทุกช่องหรือยัง
      const isFull = !currentGuess.includes(null);

      if (!isFull) {
        // หากยังไม่ครบ ให้เลื่อนไปช่องว่างถัดไป
        if (selectedSlotIndex < codeLength - 1) {
          selectedSlotIndex++;
        }
        updateSlotHighlights();
      } else {
        // หากเลือกครบแล้ว ให้เอาขอบไฮไลต์สีฟ้าออกทันที และเปิดใช้งานปุ่มส่งคำตอบ
        activeRow.querySelectorAll('.peg').forEach(p => p.classList.remove('selected'));
      }

      submitBtn.disabled = !isFull;
    });

    // ส่งคำตอบและประมวลผล
    submitBtn.addEventListener('click', () => {
      if (currentGuess.includes(null) || isGameOver) return;

      const feedbackResult = evaluateGuess(currentGuess, secretCode);
      renderFeedback(feedbackResult);

      if (feedbackResult.exact === codeLength) {
        statusMsg.style.color = '#2ecc71';
        statusMsg.textContent = '🎉 ยินดีด้วย! คุณถอดรหัสสำเร็จแล้ว!';
        revealSecretCode();
        endGame();
      } else if (currentAttempt === MAX_ATTEMPTS - 1) {
        statusMsg.style.color = '#e74c3c';
        statusMsg.textContent = '😭 ขอแสดงความเสียใจด้วยคุณตอบผิด กรุณาลองใหม่อีกครั้ง';
        revealSecretCode();
        endGame();
      } else {
        const currentRow = document.getElementById(`row-${currentAttempt}`);
        currentRow.classList.remove('active');
        currentRow.querySelectorAll('.peg').forEach(p => p.classList.remove('selected'));

        currentAttempt++;
        selectedSlotIndex = 0;
        currentGuess = new Array(codeLength).fill(null);
        submitBtn.disabled = true;

        const nextRow = document.getElementById(`row-${currentAttempt}`);
        nextRow.classList.add('active');
        updateSlotHighlights();
      }
    });

    // คำนวณหมุดเฉลย
    function evaluateGuess(guess, code) {
      let exact = 0;
      let color = 0;

      const codeCopy = [...code];
      const guessCopy = [...guess];

      for (let i = 0; i < codeLength; i++) {
        if (guessCopy[i] === codeCopy[i]) {
          exact++;
          codeCopy[i] = null;
          guessCopy[i] = null;
        }
      }

      for (let i = 0; i < codeLength; i++) {
        if (guessCopy[i] !== null) {
          const matchIndex = codeCopy.indexOf(guessCopy[i]);
          if (matchIndex !== -1) {
            color++;
            codeCopy[matchIndex] = null;
          }
        }
      }

      return { exact, color };
    }

    // แสดงผลหมุดคำตอบ
    function renderFeedback({ exact, color }) {
      const activeRow = document.getElementById(`row-${currentAttempt}`);
      const fbPegs = activeRow.querySelectorAll('.feedback-peg');
      
      let index = 0;
      for (let i = 0; i < exact; i++) {
        fbPegs[index++].classList.add('exact');
      }
      for (let i = 0; i < color; i++) {
        fbPegs[index++].classList.add('color');
      }
    }

    function endGame() {
      isGameOver = true;
      submitBtn.disabled = true;
      const activeRow = document.getElementById(`row-${currentAttempt}`);
      if (activeRow) {
        activeRow.querySelectorAll('.peg').forEach(p => p.classList.remove('selected'));
      }
    }

    resetBtn.addEventListener('click', initGame);

    // เริ่มเกมครั้งแรก
    initGame();
  </script>
</body>
</html>
